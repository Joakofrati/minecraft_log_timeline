<main class="shell">
  <header class="hero">
    <p class="eyebrow">MINECRAFT LOG TIMELINE</p>
    <h1>Tu aventura, ordenada en el tiempo</h1>
    <p>Selecciona tus logs y explora los eventos <code>[DP_EVENT]</code> sin subir ningún archivo.</p>
    <app-file-upload (filesSelected)="selectFiles($event)" />
  </header>

  <app-file-list [logs]="logs()" (playerChanged)="changePlayer($event)" />

  @if (allEvents().length > 0) {
    <app-filters
      [players]="players()"
      [types]="types()"
      [filters]="filters()"
      (filtersChanged)="filters.set($event)"
    />
    <div class="actions">
      <span>{{ filteredEvents().length }} eventos visibles</span>
      <div>
        <button type="button" (click)="exportJson()" [disabled]="filteredEvents().length === 0">Exportar JSON</button>
        <button type="button" (click)="exportCsv()" [disabled]="filteredEvents().length === 0">Exportar CSV</button>
      </div>
    </div>
  }

  <app-timeline [events]="filteredEvents()" [emptyMessage]="emptyMessage()" />
</main>
